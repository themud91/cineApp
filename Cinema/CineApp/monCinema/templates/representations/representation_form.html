{# Page pour créer ou modifier une représentation #}

{% extends 'maitre.html' %}

{% block titre %}Cinéma – Représentation{% endblock %}
{% block titrepage %}Formulaire Représentation{% endblock %}

{% block contenu %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Sauvegarder</button>
                <a href="{% url 'representation_list' %}" class="btn btn-secondary">Annuler</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
